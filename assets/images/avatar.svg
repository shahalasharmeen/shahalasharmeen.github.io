<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="120" cy="120" r="112" fill="url(#grad-bg)" />
  
  <!-- Outer decorative tech ring -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="url(#ring-grad)" stroke-width="3" stroke-dasharray="16 8" opacity="0.85" />
  
  <!-- Subtle decorative geometric background dots/nodes -->
  <circle cx="50" cy="70" r="3" fill="#ffffff" opacity="0.4" />
  <circle cx="190" cy="65" r="4" fill="#ffffff" opacity="0.3" />
  <circle cx="45" cy="170" r="3.5" fill="#38bdf8" opacity="0.5" />
  <circle cx="195" cy="165" r="3" fill="#10b981" opacity="0.5" />
  <line x1="50" y1="70" x2="80" y2="90" stroke="#ffffff" stroke-width="1" opacity="0.25" />
  <line x1="190" y1="65" x2="160" y2="85" stroke="#ffffff" stroke-width="1" opacity="0.25" />

  <!-- Stylized Person Avatar / Silhouette Profile -->
  <!-- Shoulders / Torso -->
  <path d="M 60 215 C 60 170, 85 152, 120 152 C 155 152, 180 170, 180 215 Z" fill="#ffffff" opacity="0.95" />
  
  <!-- Neck -->
  <rect x="110" y="132" width="20" height="24" rx="6" fill="#fde047" opacity="0.9" />

  <!-- Head -->
  <circle cx="120" cy="100" r="38" fill="#fde047" opacity="0.9" />

  <!-- Hijab / Hair drape style silhouette (elegant & professional) -->
  <path d="M 78 106 C 78 62, 92 50, 120 50 C 148 50, 162 62, 162 106 C 162 144, 150 162, 120 162 C 90 162, 78 144, 78 106 Z" fill="#0f172a" opacity="0.85" />
  
  <!-- Face Oval -->
  <ellipse cx="120" cy="104" rx="26" ry="30" fill="#fde68a" />

  <!-- Smart Glasses / Tech Accent -->
  <rect x="100" y="96" width="16" height="12" rx="3" fill="none" stroke="#2563eb" stroke-width="2.5" />
  <rect x="124" y="96" width="16" height="12" rx="3" fill="none" stroke="#2563eb" stroke-width="2.5" />
  <line x1="116" y1="102" x2="124" y2="102" stroke="#2563eb" stroke-width="2.5" />

  <!-- Smile -->
  <path d="M 112 120 Q 120 126 128 120" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Monogram Badge on Chest -->
  <circle cx="120" cy="190" r="16" fill="#1e3a8a" filter="url(#glow)" />
  <text x="120" y="196" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">SK</text>
</svg>
